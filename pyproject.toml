[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-fit"
version = "0.1.0"
description = "Profile → angle → tailored CV + outreach. Playbook extracted from real multi-angle resume corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Career Fit contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
career-fit = "career_fit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
