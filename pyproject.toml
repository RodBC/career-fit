[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-fit"
version = "0.2.0"
description = "Profile → angle → tailored CV + outreach. Playbook extracted from real multi-angle resume corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Career Fit contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
linkedin = [
  "camoufox[geoip]>=0.4.0",
  "google-api-python-client>=2.100",
  "google-auth-oauthlib>=1.1",
  "pyotp>=2.9",
]

[project.scripts]
career-fit = "career_fit.cli:main"
career-fit-api = "career_fit.api:run"

[tool.setuptools.packages.find]
where = ["src"]
